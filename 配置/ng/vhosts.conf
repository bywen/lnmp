server {
        
        listen 80 ; 
        listen 443 ssl;
        server_name shop.bangsales.com cdn.bangsales.com;
        ssl_certificate /data/keys/202305_shop.bangsales.com.pem;
        ssl_certificate_key /data/keys/202305_shop.bangsales.com.key;
 	rewrite_log on;
	error_log logs/bb_error.log notice;
        #access_log logs/bb_access.log;
	access_log off;
        index index.htm index.html;
        sendfile on;
        gzip on;
        gzip_types  text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png image/x-icon; #压缩文件类型,缺啥补啥
        include mime.types;
        default_type application/octet-stream;
        client_max_body_size 10M; 
	root /data/html/;	
	
        if ($scheme = http ) {
        return 301 https://$host$request_uri;
        }       
       
	#add_header Access-Control-Allow-Origin *;
        #add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
   	#add_header Access-Control-Allow-Headers 'DNT,Keep-Alive,User-Agent,Cache-Control,Content-Type,Authorization';

	
	location / {

	#alias /data/html/;
         try_files $uri /index.html /index.htm =404;
	  # proxy_pass   http://www.bangsales.com;
        }

        location /home/ {
           alias /data/html/vue-singleshop-dist/vue-singleshop-dist/;
           try_files $uri /index.html /index.htm =404;
        }

	 location /demo/ {
           alias /data/html/demo/;
           try_files $uri /index.html /index.htm =404;
        }


        location /m/ {
